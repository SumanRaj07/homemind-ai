[project]
name = "homemind-ai"
version = "0.1.0"
description = "HomeMind AI — a local-first private personal AI assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HomeMind AI Contributors" }]
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.35",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<0.29",
    "sqlalchemy>=2.0,<2.1",
    "pymupdf>=1.24,<1.27",
    "python-multipart>=0.0.9,<0.0.20",
    "streamlit>=1.37,<1.42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<0.25",
    "httpx>=0.27,<0.29",
    "ruff>=0.5,<0.8",
    "mypy>=1.10,<1.12",
]

[project.scripts]
homemind-api = "homemind.api.app:main"
homemind-ui = "homemind.ui_launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homemind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "DTZ"]
ignore = ["S101", "S104", "S108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/homemind/api/**" = ["S104"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
